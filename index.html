<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Avinya AutonexX - Edge-Roller Swing Gate Simulation</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #05070a;
            color: #f0f6fc;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- RESPONSIVE APP CONTAINER --- */
        .mobile-container {
            width: 100vw;
            height: 100vh;
            max-width: 420px;
            max-height: 880px;
            background: #0f1319;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 50px rgba(0,0,0,0.9);
            overflow: hidden;
        }

        @media (min-width: 768px) {
            .mobile-container {
                height: 92vh;
                border-radius: 32px;
                border: 2px solid #30363d;
            }
        }

        /* --- VIEWPORT DISPLAY (Top Half) --- */
        .viewport {
            position: relative;
            width: 100%;
            height: 55%;
            background: #000;
            overflow: hidden;
            flex-shrink: 0;
            perspective: 1000px;
        }

        /* MODERN ARCHITECTURAL HOUSE BACKGROUND */
        .house-bg-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center top;
            z-index: 1;
            filter: brightness(0.85) contrast(1.1);
        }

        .viewport-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            background: linear-gradient(to bottom, 
                rgba(0,0,0,0.1) 0%, 
                rgba(0,0,0,0) 50%, 
                rgba(15,23,42,0.6) 80%, 
                rgba(15,23,42,0.98) 100%);
            pointer-events: none;
        }

        /* ARCHITECTURAL BOUNDARY WALLS BESIDE PILLARS */
        .boundary-wall-left, .boundary-wall-right {
            position: absolute;
            bottom: 22px;
            height: 140px;
            background: linear-gradient(180deg, #2b3544 0%, #151c28 100%);
            border-top: 4px solid #475569;
            border-bottom: 2px solid #090d16;
            z-index: 11;
            box-shadow: 0 5px 15px rgba(0,0,0,0.8);
        }

        .boundary-wall-left {
            left: 0;
            width: 18px; /* Extends from left edge to left pillar */
            border-right: 1px solid #475569;
        }

        .boundary-wall-right {
            right: 0;
            width: 18px; /* Extends from right edge to right pillar */
            border-left: 1px solid #475569;
        }

        /* PILLARS */
        .swing-pillar-left, .swing-pillar-right {
            position: absolute;
            bottom: 22px;
            width: 22px;
            height: 145px;
            background: linear-gradient(90deg, #1e293b, #475569, #0f172a);
            border: 1px solid #64748b;
            border-radius: 4px;
            z-index: 12;
            box-shadow: 0 5px 15px rgba(0,0,0,0.8);
        }
        .swing-pillar-left { left: 18px; }
        .swing-pillar-right { right: 18px; }

        /* --- SWING GATES WITH EDGE ROLLER MOTORS --- */
        .swing-gates-container {
            position: absolute;
            bottom: 25px;
            left: 40px;
            width: calc(100% - 80px);
            height: 125px;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
        }

        .swing-leaf {
            width: 49.5%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.05s linear;
        }

        .swing-leaf.left-leaf { transform-origin: left center; }
        .swing-leaf.right-leaf { transform-origin: right center; }

        /* GATE DESIGN */
        .gate-panel-body {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 112px;
            background: #1b1e24;
            border: 3px solid #0d0f13;
            border-radius: 3px;
            display: flex;
            flex-direction: column;
            padding: 4px;
            gap: 4px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.85);
        }

        .louver-slat {
            flex: 1;
            background: #252a33;
            border: 1px solid #14171d;
            border-radius: 2px;
            box-shadow: inset 0 2px 3px rgba(0,0,0,0.6);
            position: relative;
        }

        .louver-slat::after {
            content: '';
            position: absolute;
            bottom: 1px;
            left: 0;
            width: 100%;
            height: 2px;
            background: #38bdf8;
            opacity: 0.6;
        }

        /* BOTTOM ROLLING MOTOR */
        .bottom-roller-housing {
            position: absolute;
            bottom: 0;
            width: 30px;
            height: 14px;
            background: linear-gradient(180deg, #334155, #0f172a);
            border: 1px solid #64748b;
            border-radius: 3px;
            z-index: 15;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.8);
        }
        .left-leaf .bottom-roller-housing { right: 2px; }
        .right-leaf .bottom-roller-housing { left: 2px; }

        .roller-caster-wheel {
            width: 10px;
            height: 10px;
            background: radial-gradient(circle, #f8fafc 30%, #0284c7 80%);
            border-radius: 50%;
            box-shadow: 0 0 5px #38bdf8;
        }

        .swing-ground-line {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 25px;
            background: #090d16;
            border-top: 2px dashed #22c55e;
            z-index: 5;
        }

        /* --- HAND HELD REMOTE INTERFACE (Bottom Half) --- */
        .hand-held-perspective {
            position: relative;
            flex: 1;
            background: radial-gradient(circle at 50% 100%, #1e293b 0%, #090d16 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            overflow: hidden;
            border-top: 2px solid #334155;
        }

        .keyfob-3d-hardware {
            width: 190px;
            height: 250px;
            background: linear-gradient(165deg, #3a4150 0%, #1a1d24 40%, #0d0f13 100%);
            border-radius: 32px 32px 40px 40px;
            border: 2px solid #525b6c;
            box-shadow: 
                0 15px 35px rgba(0,0,0,0.9),
                inset 0 2px 3px rgba(255,255,255,0.3),
                inset 0 -4px 8px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px;
            position: relative;
            transform: perspective(600px) rotateX(10deg);
            transition: transform 0.1s ease;
        }

        .keyfob-top-loop {
            position: absolute;
            top: -10px;
            width: 36px;
            height: 16px;
            border: 4px solid #475569;
            border-bottom: none;
            border-radius: 8px 8px 0 0;
            background: linear-gradient(180deg, #64748b, #1e293b);
        }

        .fob-brand-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 4px;
            margin-bottom: 8px;
            padding: 0 6px;
        }

        .fob-metallic-logo {
            font-size: 0.55rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: #94a3b8;
        }

        .fob-led-housing {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #0f172a;
            border: 1px solid #334155;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .fob-led-bulb {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #334155;
            transition: all 0.1s ease;
        }

        .fob-led-bulb.emitting {
            background: #00f0ff;
            box-shadow: 0 0 10px #00f0ff, 0 0 16px #00f0ff;
        }

        .fob-button-pad {
            width: 100%;
            flex: 1;
            background: linear-gradient(180deg, #15181e 0%, #0b0c0f 100%);
            border-radius: 22px;
            border: 1px solid #2d333f;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.8);
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            justify-content: center;
        }

        .tactile-btn {
            width: 100%;
            height: 38px;
            border-radius: 12px;
            border: 1px solid #1a1d24;
            background: linear-gradient(180deg, #2c323d 0%, #171a20 100%);
            color: #e2e8f0;
            font-weight: 800;
            font-size: 0.65rem;
            letter-spacing: 0.8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            cursor: pointer;
            box-shadow: 
                0 4px 0 #090a0c,
                0 5px 8px rgba(0,0,0,0.7),
                inset 0 1px 1px rgba(255,255,255,0.2);
            transition: all 0.08s ease;
            user-select: none;
        }

        .tactile-btn:active, .tactile-btn.pressed {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #090a0c;
        }

        .tactile-btn.btn-open {
            background: linear-gradient(180deg, #0284c7 0%, #0369a1 100%);
            border-color: #38bdf8;
            color: #ffffff;
            box-shadow: 0 4px 0 #0c4a6e, 0 5px 8px rgba(0,0,0,0.7);
        }

        .tactile-btn.btn-stop {
            background: linear-gradient(180deg, #e11d48 0%, #be123c 100%);
            border-color: #fda4af;
            color: #ffffff;
            box-shadow: 0 4px 0 #4c0519, 0 5px 8px rgba(0,0,0,0.7);
        }

        .btn-icon {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }

        .thumb-operator {
            position: absolute;
            bottom: -60px;
            right: -10px;
            width: 100px;
            height: 150px;
            background: linear-gradient(135deg, #e0a98b 0%, #bc7f63 60%, #8d533a 100%);
            border-radius: 40px 40px 0 0;
            box-shadow: -10px 10px 30px rgba(0,0,0,0.6);
            z-index: 50;
            pointer-events: none;
            transform: rotate(-25deg) translateY(90px);
            transition: transform 0.15s ease;
        }

        .thumb-operator.target-open { transform: rotate(-20deg) translate(-35px, -65px); }
        .thumb-operator.target-close { transform: rotate(-20deg) translate(-35px, -25px); }
        .thumb-operator.target-stop { transform: rotate(-20deg) translate(-35px, 15px); }
    </style>
</head>
<body>

<div class="mobile-container">
    <!-- VIEWPORT DISPLAY -->
    <div class="viewport">
        <!-- MODERN VILLA BACKGROUND -->
        <img class="house-bg-img" src="https://images.unsplash.com/photo-1512917774080-9991f1c4c750?auto=format&fit=crop&w=1000&q=80" alt="Ultra Modern Villa">
        <div class="viewport-overlay"></div>

        <!-- BOUNDARY WALLS AND PILLARS -->
        <div class="boundary-wall-left"></div>
        <div class="swing-pillar-left"></div>

        <div class="boundary-wall-right"></div>
        <div class="swing-pillar-right"></div>

        <!-- DUAL SWING GATE LEAVES WITH EDGE ROLLER MOTORS -->
        <div class="swing-gates-container">
            <!-- Left Leaf -->
            <div class="swing-leaf left-leaf" id="left-leaf">
                <div class="gate-panel-body">
                    <div class="louver-slat"></div>
                    <div class="louver-slat"></div>
                    <div class="louver-slat"></div>
                    <div class="louver-slat"></div>
                </div>
                <div class="bottom-roller-housing">
                    <div class="roller-caster-wheel"></div>
                </div>
            </div>

            <!-- Right Leaf -->
            <div class="swing-leaf right-leaf" id="right-leaf">
                <div class="gate-panel-body">
                    <div class="louver-slat"></div>
                    <div class="louver-slat"></div>
                    <div class="louver-slat"></div>
                    <div class="louver-slat"></div>
                </div>
                <div class="bottom-roller-housing">
                    <div class="roller-caster-wheel"></div>
                </div>
            </div>
        </div>

        <!-- DRIVEWAY BASE -->
        <div class="swing-ground-line"></div>
    </div>

    <!-- HAND HELD OPERATIONAL REMOTE PERSPECTIVE -->
    <div class="hand-held-perspective">
        <div class="keyfob-3d-hardware" id="keyfob">
            <div class="keyfob-top-loop"></div>
            
            <div class="fob-brand-header">
                <span class="fob-metallic-logo">REMOTE</span>
                <div class="fob-led-housing">
                    <div class="fob-led-bulb" id="led-bulb"></div>
                </div>
            </div>

            <div class="fob-button-pad">
                <button class="tactile-btn btn-open" id="btn-open" onclick="operateGate('OPEN')">
                    <span>GATE OPEN</span>
                    <svg class="btn-icon" viewBox="0 0 24 24"><path d="M12 4L4 16h16z"/></svg>
                </button>
                
                <button class="tactile-btn" id="btn-close" onclick="operateGate('CLOSE')">
                    <span>GATE CLOSE</span>
                    <svg class="btn-icon" viewBox="0 0 24 24"><path d="M12 20l8-12H4z"/></svg>
                </button>
                
                <button class="tactile-btn btn-stop" id="btn-stop" onclick="operateGate('STOP')">
                    <span>EMERGENCY STOP</span>
                    <svg class="btn-icon" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/></svg>
                </button>
            </div>
        </div>

        <div class="thumb-operator" id="thumb-hand"></div>
    </div>
</div>

<script>
    const leftLeaf = document.getElementById('left-leaf');
    const rightLeaf = document.getElementById('right-leaf');
    const ledBulb = document.getElementById('led-bulb');
    const thumbHand = document.getElementById('thumb-hand');
    const keyfob = document.getElementById('keyfob');

    let currentProgress = 0;
    let gateState = 'IDLE';
    let animFrame = null;
    const maxOpenAngle = 82;

    let audioCtx = null;
    let beepInterval = null;

    function initAudioContext() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function playDualToneBeep() {
        initAudioContext();
        if (!audioCtx) return;

        try {
            const now = audioCtx.currentTime;
            
            const osc1 = audioCtx.createOscillator();
            const gain1 = audioCtx.createGain();
            osc1.type = 'triangle';
            osc1.frequency.setValueAtTime(950, now);
            gain1.gain.setValueAtTime(0.1, now);
            gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
            osc1.connect(gain1);
            gain1.connect(audioCtx.destination);
            osc1.start(now);
            osc1.stop(now + 0.12);

            const osc2 = audioCtx.createOscillator();
            const gain2 = audioCtx.createGain();
            osc2.type = 'triangle';
            osc2.frequency.setValueAtTime(650, now + 0.13);
            gain2.gain.setValueAtTime(0.1, now + 0.13);
            gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
            osc2.connect(gain2);
            gain2.connect(audioCtx.destination);
            osc2.start(now + 0.13);
            osc2.stop(now + 0.25);

        } catch (e) {
            console.error("Audio playback error:", e);
        }
    }

    function startHazardSound() {
        if (beepInterval) return;
        playDualToneBeep();
        beepInterval = setInterval(() => {
            playDualToneBeep();
        }, 700);
    }

    function stopHazardSound() {
        if (beepInterval) {
            clearInterval(beepInterval);
            beepInterval = null;
        }
    }

    function operateGate(action) {
        if (navigator.vibrate) {
            navigator.vibrate(40);
        }

        thumbHand.className = 'thumb-operator target-' + action.toLowerCase();
        
        const btnObj = document.getElementById('btn-' + action.toLowerCase());
        if (btnObj) btnObj.classList.add('pressed');

        ledBulb.classList.add('emitting');
        keyfob.style.transform = 'perspective(600px) rotateX(14deg) translateY(2px)';

        setTimeout(() => {
            ledBulb.classList.remove('emitting');
            keyfob.style.transform = 'perspective(600px) rotateX(10deg)';
            if (btnObj) btnObj.classList.remove('pressed');
            thumbHand.className = 'thumb-operator';
        }, 300);

        if (action === 'STOP') {
            gateState = 'IDLE';
            stopHazardSound();
            if (animFrame) {
                cancelAnimationFrame(animFrame);
                animFrame = null;
            }
            return;
        }

        if (action === 'OPEN' && currentProgress < 100) {
            gateState = 'OPENING';
            startHazardSound();
        } else if (action === 'CLOSE' && currentProgress > 0) {
            gateState = 'CLOSING';
            startHazardSound();
        }

        if (!animFrame) {
            animFrame = requestAnimationFrame(updateSwingPhysics);
        }
    }

    function updateSwingPhysics() {
        if (gateState === 'IDLE') {
            stopHazardSound();
            return;
        }

        if (gateState === 'OPENING') {
            if (currentProgress < 100) {
                currentProgress += 0.5;
                if (currentProgress >= 100) {
                    currentProgress = 100;
                    gateState = 'IDLE';
                    stopHazardSound();
                }
            }
        } else if (gateState === 'CLOSING') {
            if (currentProgress > 0) {
                currentProgress -= 0.5;
                if (currentProgress <= 0) {
                    currentProgress = 0;
                    gateState = 'IDLE';
                    stopHazardSound();
                }
            }
        }

        const currentAngle = (currentProgress / 100) * maxOpenAngle;
        
        leftLeaf.style.transform = `rotateY(-${currentAngle}deg)`;
        rightLeaf.style.transform = `rotateY(${currentAngle}deg)`;

        if (gateState !== 'IDLE') {
            animFrame = requestAnimationFrame(updateSwingPhysics);
        } else {
            animFrame = null;
            stopHazardSound();
        }
    }
</script>

</body>
</html>
